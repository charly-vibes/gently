# lefthook — git hooks for gently
# Managed blocks (beads, specodelic) are appended by their tools;
# never edit inside a "# BEGIN <tool>" / "# END" pair by hand.
#
# Note: the SPK managed gate lints openspec/ only; until the first
# dual-format deltas exist there, `spk lint openspec` exits 2 ("nothing
# to lint"), so the run line tolerates exit 2 and fails on exit 1.
# Re-run `specodelic hooks install` to restore the canonical form once
# deltas exist.

pre-commit:
  parallel: true
  commands:
    bd:
      run: bd hooks run pre-commit
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    fmt-check:
      glob: "*.rs"
      run: just fmt-check
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      # no --mode override: the toml's guidance lease governs (ddl parity —
      # "the toml supplies the lease + repo mode so local runs match CI
      # exactly"); --mode gate would defeat the dated advisory lease.
      # NOTE (gently-if4): pretender ≥0.9.0 can now run gate mode without
      # hard-blocking on mechanical reformats (`check --adopt` writes a
      # stable-finding baseline; gate fails only on genuinely new findings —
      # meter verified 2026-10-15). Switching is deferred to a dedicated
      # dated-lease renewal, not slipped in here.
      run: pretender check
    ddl-spk-lint:
      run: spk lint openspec
    # ddl:managed:end (pre-commit)
    spec-drift-gate:
      # Regenerate the deployed mirror from the corpus and fail unless a
      # fresh redeploy is staged into this commit. The failure output names
      # the remedy — "current but unstaged" (fresh worktree, untouched index)
      # vs "staged mirror is stale" — instead of a misleading "stale" for
      # both (beads gently-cgw; logic in tools/spec_drift_gate.sh).
      run: bash tools/spec_drift_gate.sh
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec || test $? -eq 2
    # <!-- SPK:END -->
    specodelic-lint:
      run: specodelic lint --human
      skip:
        - merge
        - rebase

pre-push:
  commands:
    bd:
      # bd blocks reading stdin until EOF; git/lefthook keep the pre-push
      # pipe open, so close it (bd needs no ref payload) — see bead for the
      # reproduction (open pipe → hang, EOF → clean exit).
      run: bd hooks run pre-push < /dev/null
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    specodelic-compile:
      # rustfmt post-pass: generated *_props.rs is not fmt-clean
      # (specodelic#15); without it the corpus churns dirty on every push.
      run: specodelic compile specs --human && specodelic model-check specs --human && rustfmt --edition 2021 specodelic/*.rs
      skip:
        - merge
        - rebase
    cargo-gate:
      run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
      skip:
        - merge
        - rebase
