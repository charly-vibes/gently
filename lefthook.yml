# lefthook — git hooks for gently
# Managed blocks (beads, specodelic) are appended by their tools;
# never edit inside a "# BEGIN <tool>" / "# END" pair by hand.
#
# Note: the SPK managed gate lints openspec/ only; until the first
# dual-format deltas exist there, `spk lint openspec` exits 2 ("nothing
# to lint"), so the run line tolerates exit 2 and fails on exit 1.
# Re-run `specodelic hooks install` to restore the canonical form once
# deltas exist.

pre-commit:
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --mode gate
    ddl-spk-lint:
      run: spk lint openspec
    # ddl:managed:end (pre-commit)
    spec-drift-gate:
      # Regenerate deployed specs from the corpus and fail on any diff —
      # an edited corpus file without redeploy cannot slip past the gates.
      run: |
        python3 tools/deploy_specs.py >/dev/null
        git diff --exit-code -- openspec/specs/ || {
          echo "drift: openspec/specs/ is stale — corpus changed without redeploy" >&2
          git --no-pager diff --stat -- openspec/specs/ >&2
          exit 1
        }
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec || test $? -eq 2
    # <!-- SPK:END -->
    specodelic-lint:
      run: specodelic lint --human
      skip:
        - merge
        - rebase

pre-push:
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    specodelic-compile:
      run: specodelic compile specs --human && specodelic model-check specs --human
      skip:
        - merge
        - rebase
    cargo-gate:
      run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
      skip:
        - merge
        - rebase
