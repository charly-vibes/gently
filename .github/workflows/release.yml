# Release workflow — publish both crates on version tags
#
# Triggered by pushing a version tag (e.g., `git tag v0.1.0 && git push --tags`).
# Publishes gently-core first (gently-cli path-depends on it), then gently-cli.
#
# Required secrets:
#   CARGO_REGISTRY_TOKEN   - crates.io API token for publishing the crates
#
# Pre-push meter (runs locally, no tag needed): actionlint on this file.
# End-to-end gate: the first tag push publishes both crates.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tag must match the workspace version — publishing a stale tag is
      # worse than failing loudly.
      - name: Verify tag matches workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match workspace version $version" >&2
            exit 1
          }

      - name: Publish gently-core
        run: cargo publish -p gently-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # gentle-cli path-depends on gently-core; wait for the index to see it.
      - name: Publish gently-cli
        run: |
          sleep 15
          cargo publish -p gently-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}