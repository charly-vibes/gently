# cargo-deny configuration — the CI workflow (ci.yml, cargo-deny job) runs
# `check advisories licenses`. Without this file the default allow list is
# empty and every crate is rejected. Allow the permissive licenses actually
# present in Cargo.lock (verified: cargo deny check licenses, 2026-10-10).

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
