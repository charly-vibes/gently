[package]
name = "gently-cli"
description = "CLI for gently: graph text in, rendered output out"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "gently"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
genesis-vibes = { version = "0.12.1", default-features = false }
gently-core = { path = "../gently-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true