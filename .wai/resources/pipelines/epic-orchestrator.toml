# Epic-orchestrator pipeline: lead orchestrates only, subagents implement.
#
# Encodes the orchestrator + subagents pattern (canon:
# ~/.wai/resources/patterns/orchestrator-subagents.md) as enforceable steps.
# Canon Invariant 8 — "Prose does not enforce": wherever the pattern is
# load-bearing, encode the loop as a wai pipeline + brief template + status
# recipe, and let the tooling refuse bad spawns.
#
# Canon invariants encoded by this loop:
#   1. The lead orchestrates only (claim → brief → spawn → verify → ship).
#   3. One ticket per advance — the loop ends in an explicit STOP at the
#      ticket boundary; no chaining past it.
#   4. Briefs are repo artifacts, committed before spawn.
#   5. Verify before trust — reports are claims, not facts.
#   7. Progress must be pokeable — spawns stream to a known log path.
#
# Usage: wai pipeline start epic-orchestrator --topic="<epic name>"

[pipeline]
name = "epic-orchestrator"
description = "Orchestrator loop: claim one ready child, gate, brief, spawn a subagent, verify, ship, STOP"

[pipeline.metadata]
when = "Executing one ready child issue of an epic via subagent orchestration instead of inline implementation"
skills = ["tdd", "rule-of-5-universal", "commit"]

[[steps]]
id = "claim"
prompt = """
{topic}: Orient and claim exactly one ready child issue from the epic.

Run:
- `wai prime`
- `wai status`
- `bd ready` if beads is present
- `openspec list` if openspec is present
- `wai search "<topic>"`

Rules:
- Select exactly one ready, unblocked child issue. Prefer P1, then P2, then P3.
- Claim atomically: `bd update <id> --claim`.
- Check for file-level conflicts with other in_progress tickets before writing code.
- Write the durable per-ticket run state file (create if absent):
  `.wai/projects/<project>/runs/<ticket>.state` containing the ticket id,
  branch, brief path (empty until the brief step), and an empty step history.
- Retry entry: if the state file already exists, read it and run the drift
  check before resuming — refuse to resume when HEAD advanced without a
  completed step accounting for the advance. A mid-run advance is EXPECTED
  (the implementor commits) and is never flagged as drift. Retry reads
  state and resumes from the last completed gate, not from the beginning.
- If the ticket is ambiguous or larger than one session, stop and file follow-up tickets.

Record orientation: `wai add research "ORIENT: selected <id>; why chosen; blockers checked"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "gates"
prompt = """
{topic}: Run pre-work gates before any implementation.

Run:
- the project's quality gates (`wai pipeline gates <pipeline>` or repo equivalent)
- test suite baseline so later failures are attributable to this change only
- openspec validation if the ticket references an openspec change

Do not start implementation until gates are understood and baseline is green.

Record gate status: `wai add research "GATES: <commands run>; results"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "brief"
prompt = """
{topic}: Write the subagent brief as a committed repo artifact.

Rules:
- Briefs are repo artifacts, not /tmp files (canon Invariant 4).
- Write the brief from the repo's brief template into a committed path:
  `.wai/projects/<project>/briefs/<slug>.md` and record its path in the
  state file's brief path field.
- Include: ticket ID, desired outcome, out of scope, exact files, exact
  test/review commands, red/green/refactor sequence, follow-up threshold.
- Commit the brief before spawn so the subagent starts from a clean tree.

Record brief: `wai add design "BRIEF: <path>; committed"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["design"]

[[steps]]
id = "spawn"
prompt = """
{topic}: Spawn a named, resumable subagent session for the brief.

Rules:
- Refuse to spawn without the state file — the spawn must be resumable
  through it.
- The spawn must be resumable and discoverable (canon Invariant 2) — a spawn
  that leaves no session record loses usage/cost/trace forever.
- Stream output to a known log path the orchestrator can tail (canon
  Invariant 7). One command must answer: what is running, which step, done
  or stuck, where is the log.
- Poll or log rather than blind-blocking.
- Retry is a new named session (canon Invariant 6): zero commits = clean
  retry, partial commits = manual resume. Retry names get a `-retry`
  suffix. Never resume a wedged spawn in-place.

Record spawn: `wai add research "SPAWN: <session name>; log=<path>"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps]]
id = "verify"
prompt = """
{topic}: Verify before trust (canon Invariant 5).

Check the subagent's report against reality:
- State checkpoint: record the branch head at verify entry — append the
  step id + sha (current HEAD) to the state file before any verification.
- `git log` / `git diff` vs the report — do the commits match the claims?
- repo gates: run the relevant test suite; reports are claims, not facts
- ticket state: does beads reflect the claimed work?

If the report and reality disagree, the discrepancy is a finding — fix or
file it before proceeding.

Record verification: `wai add research "VERIFY: <evidence>"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps.gate.oracles]]
name = "tests-pass"
description = "Relevant tests must pass after verification"
timeout = 300

[[steps]]
id = "ship"
prompt = """
{topic}: Ship the completed ticket.

Do:
- inspect `git diff` and commit atomically
- close/update the beads ticket if applicable
- mark openspec tasks complete if applicable
- push only when project policy or user instruction explicitly says to push

Record ship: `wai add research "SHIP: <commit/ticket state>"`
State checkpoint: append the step id + sha (current HEAD) to the state file before advancing.
Advance: `wai pipeline next`
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "Final tests must pass before close"
timeout = 300

[[steps]]
id = "stop"
prompt = """
{topic}: STOP at the ticket boundary (canon Invariant 3).

One ticket per advance: claim → brief → spawn → verify → ship → STOP.
Do not chain past the ticket boundary. Inline execution is the path of
least resistance and the historical failure mode (canon Invariant 1) —
the next ticket starts a fresh run, not this one.

Record STOP: `wai add research "STOP: ticket <id> complete; next run for next ticket"`
State checkpoint: append the step id + sha (current HEAD) to the state file; the run is complete.
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]
