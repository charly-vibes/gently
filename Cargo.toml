[workspace]
resolver = "2"
members = ["crates/gently-core", "crates/gently-cli"]

[workspace.package]
edition = "2021"
version = "0.2.2"
license = "GPL-2.0-or-later"
repository = "https://github.com/charly-vibes/gently"
readme = "README.md"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"