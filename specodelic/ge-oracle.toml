source = "ge.oracle"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "The oracle is upstream Graph::Easy v0.69 at commit `ededa3d787ad89ac532c578c06390e8a7b270499`, invoked via perl; every recorded fixture carries a pin header naming that version and commit."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "For every input in the shared fixture corpus, each supported output format has exactly one recorded expected output, generated by the oracle and committed alongside it."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "`just oracle-verify` re-renders every fixture input through gently and compares byte-identically to the recorded outputs; any mismatch fails naming the input, the format, and the first differing line."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c4"
kind = "effect"
expr = "A missing or drifted oracle environment — perl absent, installed Graph::Easy version differs from the pin, or a stale pin header in a fixture — produces a typed error naming what is missing and the `just oracle-record` remediation."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "`just oracle-record` regenerates recorded outputs for new inputs and updates pin headers in one pass; re-recording without a pin change is rejected as a non-deliberate change."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c6"
kind = "advisory"
expr = "The fixture corpus exercises every edge style, border style, node shape, group form, flow direction, and label placement at least once."
traces_to = "[[ge.oracle]]"

[[constraints]]
id = "c7"
kind = "invariant"
expr = "Byte-compatibility claims are admissible only for fixture classes the pinned oracle produces deterministically: an input is in scope exactly when the pinned oracle renders it identically across repeated runs under the pinned seed (hash-stable) and records it within 10 seconds wall time (envelope); claims over out-of-scope classes — hash-randomized inputs, beyond-envelope sizes, round-trip fidelity the oracle itself lacks — are verified structurally against gently's own invariants instead of byte-wise against the oracle, and no spec may state unqualified byte-equality with the oracle."
traces_to = "[[ge.oracle]]"
