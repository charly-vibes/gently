source = "ge.boxart_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "Each node renders as a box built from Unicode box-drawing glyphs (`─ │ ┌ ┐ └ ┘ ═ ║ ╔ ╗ ╚ ╝` and friends) selected by the node's border style."
traces_to = "[[ge.boxart_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Border corners and T-junctions are drawn from the actual neighbouring cells, so a junction always renders as the correct combined glyph."
traces_to = "[[ge.boxart_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "Edge styles map to the upstream Unicode edge-style table: solid `─│`, double `═║`, dotted `·:`, dashed `╴╵`, dot-dash `·-`/`!`, dot-dot-dash `··-`/`!`, wave `∼≀`, bold `━┃`, double-dash `═ `/`∥`; horizontal repeat units may span several columns per cell width."
traces_to = "[[ge.boxart_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "A node's `shape` attribute (upstream vocabulary: box, rounded, point, circle, ellipse, diamond, triangle, pentagon, hexagon, octagon, parallelogram, house, invisible, img) changes the box outline per the upstream Unicode shape table."
traces_to = "[[ge.boxart_render]]"
