source = "ge.ascii_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "Each node renders as a box whose interior is its label and whose border style (solid, dotted, dashed, double, wave, bold, wide) comes from the node's border attributes."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Edge style maps to glyph runs exactly as Graph::Easy does: solid `-->`, double `==>`, dotted `....>`, wave `~~~>`, dashed `- - >`, and arrow-less edges use the pattern without the arrow head."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "The rendered output is a function of the grid output alone: no hidden state, no dependence on input text or parse order."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "Edge labels occupy cells on their edge's routed path and never overlap node cells or other labels."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "A node label wraps into multiple interior rows exactly as upstream does, and each glyph occupies its display width (double-width glyphs take two columns); alignment never depends on byte length."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = "A node's `shape` attribute (upstream vocabulary: box, rounded, point, circle, ellipse, diamond, triangle, pentagon, hexagon, octagon, parallelogram, house, invisible, img) changes the rendered outline per the upstream ASCII shape table; color attributes do not affect ASCII output."
traces_to = "[[ge.ascii_render]]"
