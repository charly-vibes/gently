source = "ge.ascii_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "Each node renders as a box whose interior is its label and whose border style (solid, dotted, dashed, double, wave, bold, wide, broad, dot-dash, dot-dot-dash, double-dash, none) comes from the node's border attributes. Re-derived (gently-dcp): bold, wide, and broad render the SAME `#####` outline in ASCII — distinct attribute values only in the HTML border widths (tests/repro/claims/shape-outline-collapse.observed) — so the ASCII style table collapses them onto one glyph set (tests/repro/claims/ascii-render-tables.observed)."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Edge style maps to glyph runs exactly as Graph::Easy's short-edge `_draw_hor` rule: fill the gap with the style's unit token (`solid` `-`, `dotted` `.`, `dashed` `- `, `double` `==`, `wave` `~`, `bold`/`wide`/`broad` `##`, `dot-dash` `.-`, `dot-dot-dash` `..-`, `double-dash` `= `), undirected cells shift the fill by the gap cell's absolute x (`rx % len` — directed SHORT cells skip the shift), truncate to the gap width, drop one char per START_W and START_E/END_E, and a directed run replaces its last char with `>`. At the minimum gap width (5 columns, widened to 6 for dot-dot-dash per upstream `_correct_size`) the observed runs are solid `-->`/`---`, double `==>`/`===`, dotted `..>`/`...`, wave `~~>`/`~~~`, dashed `- >`/` - `, bold/wide/broad `##>`/`###`, dot-dash `.->`/`-.-`, dot-dot-dash `..->`/`-..-`, and double-dash `= >`/` = ` — the undirected runs therefore shift with the edge's column position (chain gap 2 renders `..-.`, gap 3 `.-..`). Re-derived (gently-dcp): the earlier fixed-width forms `....>` and `- - >` are false at the probed minimum width — the oracle emits the minimum runs above (tests/repro/claims/ascii-render-tables.observed); re-derived (gently-oy2): the repeated POD patterns (`..-..-..->`, `.-.-.->`, `= = >`) keep their styling, previously collapsed to plain `-->` (tests/repro/claims/edge-style-short-runs.observed); re-derived (gently-bpq): a labeled UNDIRECTED run draws NO arrowhead — the fill pattern only (upstream `_draw_hor` heads only on EDGE_END_* flags; `------------` in tests/repro/claims/pod-label-attr.observed); re-derived (gently-7qz): a BIDIRECTIONAL edge (`<-->`, `<-- label -->`) renders its straight run through an EDGE_SHORT_BD_EW cell — BOTH arrowheads point outward (` <` + fill + `>` drawn at cell-x 0, `w-1` chars), the undirected ofs shift still applies, upstream `_correct_size` widens the horizontal BD cell by one column (solid ` <--> ` at gap 6; labeled ` <-------> ` at gap 11 = label + 5 + 1 with the label centered in [2, w-3) of the widened cell — tests/repro/claims/pod-bidir.observed, pod-bidir-label-straight.observed), and a BENT BD edge stamps the START arrowhead at the source's exit attachment pointing INTO the source box (exit North → `v`, mirroring the target-side entry rule — tests/repro/claims/pod-bidir-parallel.observed); re-derived (gently-51d): `wide` and `broad` render the BOLD runs byte-for-byte — upstream As_ascii `$edge_styles` rows wide/broad are identical to bold (`##`) and `_correct_size` does NOT widen their gap (only dot-dot-dash), so the directed runs are `##>` and the arrow-less runs are `###` (tests/repro/claims/pod-style-family.observed, edge-style-wide-undirected.observed); re-derived (gently-klf): a vertical edge run attaches at its edge cell's LEFT+2 — upstream `_draw_cross` draws the vertical line at fixed offset 2 within the cell (`_printfb_ver($fb, 2, 0, $line)`), not at the node's center, so a wide box's north/south edge attachments sit 2 chars in from its left border (tests/repro/claims/pod-triangle.observed: the triangle's back-edge rides the band with `|` at Bonn's left+2 and the `v` at Hamburg's left+2; every pinned vertical attachment in the corpus sits at left+2); re-derived (gently-yhg): a straight edge with `minlen >= 2` widens its gap by exactly ONE column — the probed oracle renders minlen 2, 3, 4 and 5 identically (one extra GAP_WIDTH, the run filling the doubled gap; tests/repro/claims/bg-minlen-stretch.observed, 4-seed stable), and the stretch is a gap-column WIDTH, not a placement change — the bg-minlen-bypass shape renders byte-identically WITHOUT minlen (probed), pinning a shared-middle bypass ranking divergence instead (follow-up bead); gently implements exactly this rule."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "The rendered output is a function of the grid output alone: no hidden state, no dependence on input text or parse order."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "Edge labels occupy cells on their edge's routed path and never overlap node cells or other labels. Re-derived (gently-527): a straight edge's label CELL is sized by its widest line — width = longest-line byte length + 5 (+1 for a bidirectional arrowhead column), height = lines + 2 — and every cell in that row is grown to the row height (upstream `_prepare_layout` rewrites each cell's h to its row's height), so a multiline label grows its band and both endpoint boxes grow one blank interior row with vertically centered labels; the label rows render one per line, bottom-aligned in the cell's `h-2` field starting at byte offset 2 (`w-5` bytes wide eastward — `ws = xs + xr = 3` with the east head reserving the last byte — `w-4` westward), left-aligned by default (upstream's edge `align` attribute defaults `left`, node `center`) (tests/repro/claims/edge-label-split-minimal.observed, bg-multiline-align.observed, so-flowchart-size.observed); gently implements exactly this rule."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = '''A label splits into one interior row per line — a literal `\n` splits (gently-527) and the `\l`/`\r`/`\c` escapes align the FOLLOWING line left/right/center (gently-y7i) exactly as upstream `Node::_aligned_label` does: each escape terminates the previous segment (which is unescaped `\|` → `|`, `\\` → `\`, and trimmed), the segment's alignment is the PREVIOUS terminator's (`\n` means the object's default — node `center`, edge `left`), a trailing terminator adds no line, and multiline node boxes grow to lines+2 with the label rows vertically centered (upstream `_draw_label`'s middle alignment, `ys = 0.5`). Label width arithmetic counts UTF-8 BYTES (gently-bvb, re-derived: the oracle byte-lengths label text via its byte-string `length()` — `[ Köln ]` is a 7-dash box and the 中 pin is a 7-byte box, tests/repro/claims/ascii-render-tables.observed label wide glyph, label-byte-width.observed), superseding the earlier display-width reading recorded for gently-dcp; text WRAPPING (`textwrap`) stays a separate surface (gently-emd).'''
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = "A node's `shape` attribute (upstream vocabulary: rounded, point, circle, ellipse, diamond, triangle, pentagon, hexagon, octagon, parallelogram, house, invisible, img — `box` is NOT valid; the default shape is `rect`) changes the rendered outline per the upstream ASCII shape table; color attributes do not affect ASCII output. Re-derived (gently-dcp): the probed table collapses to four distinct outlines — every non-special shape renders the plain box for small nodes, `rounded` blanks the corners, `point` swaps the label for a centered `*`, `invisible` draws nothing, and `shape: box` is upstream-rejected (tests/repro/claims/ascii-render-tables.observed, shape-outline-collapse.observed); gently implements exactly this collapse."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c7"
kind = "invariant"
expr = '''An anonymous node renders BOXLESS: the upstream `Node::Anon` class carries borderstyle `none` and the label `' '` (its `_correct_size` fixes the cell at 3×3), so the node's own cell renders blank and the edges terminate at the empty space around it (`[ ] --> [ Bonn ]` leaves the anon cell as 3 blank columns with the arrow centered in the gap); an edgeless anon node contributes no visible bytes. Anonymous nodes are the empty-name nodes of the model API plus the parser-generated `#N` names (gently-6j0's odd counter; upstream's parser rejects a literal `#` in node names, so a `#\d+` name can only be parser-generated). Re-derived (gently-b0z): gently previously rendered boxed `#1`/`#3` — the oracle bytes are tests/repro/claims/pod-anon-nodes.observed (also bg-anon-chain.observed); gently implements exactly this rule.'''
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c8"
kind = "invariant"
expr = "A named group with members renders a dashed border FRAME around its members' bounding box: the `dashed` style's border glyphs (`+` corners, `- ` run shifted one, `'` sides — one char/row of padding between frame and members), the 3-row title band above (border row, title row, blank row) and the blank row + border row below. The title row renders the group's stored name verbatim at the leftmost member's box x — upstream's parser keeps the `Name:` colon in the group name (probed: `$grp->{name}` is `Cities:`) — and the title cell sits in the leftmost member's grid column, whose `label+2` minimum widens that column so the member box fills it with its label re-centered (`Cities:` widens the westmost member's box from 8 to 9 columns, `Verylonggroupname:` to 20; `G:` stays 8). Re-derived (gently-b0z, gently-7rx): gently previously drew no border — the oracle bytes are tests/repro/claims/pod-group.observed plus the probed relatives (single member, stacked members, long titles); the frame is drawn by the renderer as an overlay around the member box extents (gently's layout has no group cells), so groups whose members are disconnected (the oracle frames each separately) or whose frame a foreign edge crosses (the oracle shifts the edge through the frame) remain unpinned divergences; gently implements exactly the pinned rule."
traces_to = "[[ge.ascii_render]]"
