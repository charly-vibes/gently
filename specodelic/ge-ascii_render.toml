source = "ge.ascii_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "Each node renders as a box whose interior is its label and whose border style (solid, dotted, dashed, double, wave, bold, wide, broad, dot-dash, dot-dot-dash, double-dash, none) comes from the node's border attributes. Re-derived (gently-dcp): bold, wide, and broad render the SAME `#####` outline in ASCII — distinct attribute values only in the HTML border widths (tests/repro/claims/shape-outline-collapse.observed) — so the ASCII style table collapses them onto one glyph set (tests/repro/claims/ascii-render-tables.observed)."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Edge style maps to glyph runs exactly as Graph::Easy's short-edge `_draw_hor` rule: fill the gap with the style's unit token (`solid` `-`, `dotted` `.`, `dashed` `- `, `double` `==`, `wave` `~`, `bold` `##`, `dot-dash` `.-`, `dot-dot-dash` `..-`, `double-dash` `= `), undirected cells shift the fill by the gap cell's absolute x (`rx % len` — directed SHORT cells skip the shift), truncate to the gap width, drop one char per START_W and START_E/END_E, and a directed run replaces its last char with `>`. At the minimum gap width (5 columns, widened to 6 for dot-dot-dash per upstream `_correct_size`) the observed runs are solid `-->`/`---`, double `==>`/`===`, dotted `..>`/`...`, wave `~~>`/`~~~`, dashed `- >`/` - `, bold `##>`/`###`, dot-dash `.->`/`-.-`, dot-dot-dash `..->`/`-..-`, and double-dash `= >`/` = ` — the undirected runs therefore shift with the edge's column position (chain gap 2 renders `..-.`, gap 3 `.-..`). Re-derived (gently-dcp): the earlier fixed-width forms `....>` and `- - >` are false at the probed minimum width — the oracle emits the minimum runs above (tests/repro/claims/ascii-render-tables.observed); re-derived (gently-oy2): the repeated POD patterns (`..-..-..->`, `.-.-.->`, `= = >`) keep their styling, previously collapsed to plain `-->` (tests/repro/claims/edge-style-short-runs.observed); re-derived (gently-bpq): a labeled UNDIRECTED run draws NO arrowhead — the fill pattern only (upstream `_draw_hor` heads only on EDGE_END_* flags; `------------` in tests/repro/claims/pod-label-attr.observed); re-derived (gently-7qz): a BIDIRECTIONAL edge (`<-->`, `<-- label -->`) renders its straight run through an EDGE_SHORT_BD_EW cell — BOTH arrowheads point outward (` <` + fill + `>` drawn at cell-x 0, `w-1` chars), the undirected ofs shift still applies, upstream `_correct_size` widens the horizontal BD cell by one column (solid ` <--> ` at gap 6; labeled ` <-------> ` at gap 11 = label + 5 + 1 with the label centered in [2, w-3) of the widened cell — tests/repro/claims/pod-bidir.observed, pod-bidir-label-straight.observed), and a BENT BD edge stamps the START arrowhead at the source's exit attachment pointing INTO the source box (exit North → `v`, mirroring the target-side entry rule — tests/repro/claims/pod-bidir-parallel.observed); gently implements exactly this rule."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "The rendered output is a function of the grid output alone: no hidden state, no dependence on input text or parse order."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "Edge labels occupy cells on their edge's routed path and never overlap node cells or other labels."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "A node label wraps into multiple interior rows exactly as upstream does, and each glyph occupies its display width (double-width glyphs take two columns); alignment never depends on byte length."
traces_to = "[[ge.ascii_render]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = "A node's `shape` attribute (upstream vocabulary: rounded, point, circle, ellipse, diamond, triangle, pentagon, hexagon, octagon, parallelogram, house, invisible, img — `box` is NOT valid; the default shape is `rect`) changes the rendered outline per the upstream ASCII shape table; color attributes do not affect ASCII output. Re-derived (gently-dcp): the probed table collapses to four distinct outlines — every non-special shape renders the plain box for small nodes, `rounded` blanks the corners, `point` swaps the label for a centered `*`, `invisible` draws nothing, and `shape: box` is upstream-rejected (tests/repro/claims/ascii-render-tables.observed, shape-outline-collapse.observed); gently implements exactly this collapse."
traces_to = "[[ge.ascii_render]]"
