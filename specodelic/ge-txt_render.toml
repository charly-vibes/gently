source = "ge.txt_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "The output starts with class attribute sections for graph, node, edge, and group classes, emitted in sorted class order with sorted attribute order."
traces_to = "[[ge.txt_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Every node is emitted with its name and its instance attributes, and every edge as an operator chain whose operator matches the edge style and direction."
traces_to = "[[ge.txt_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = '''Parsing the emitted text with [[ge.text_parser]] reproduces a model with the same nodes, edges, styles, labels, directions, attributes, and group membership as the source model. Re-derived (gently-0kg, closed by gently-8jf): member node declarations are emitted inside their group's section — the upstream `( name\n  [ member ]\n)` shape (tests/repro/claims/group-edge-graphviz.observed) — so membership round-trips through the parser's group-scope rule; a node belongs to exactly one group, so its declaration lives only in that section. Group-endpoint edges remain outside the contract: upstream serializes them as plain node edges (tests/repro/claims/group-edge-graphviz.observed) and the gently model cannot represent them.'''
traces_to = "[[ge.txt_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "Recorded upstream Graph::Easy fixtures — stored under `tests/fixtures/graph-easy/` as input-text files with expected canonical-text companions, captured from one pinned upstream revision — render byte-identically."
traces_to = "[[ge.txt_render]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "Multi-cell size attributes emit in the upstream As_txt canonical form: whenever `columns` is stored, the emitted attribute set merges `columns`/`rows` into the shorter `size: W,H;` form (rows defaulting to 1) and never outputs the default `1,1`; a lone `rows` attribute is already shorter and stays `rows: N;`. A node whose every attribute collapses to nothing (e.g. `size: 1,1`) is not attribute-bearing — it is declared in the isolated-node pass, not the declaration pass. Re-derived (gently-awd): tests/repro/claims/size-attr.observed."
traces_to = "[[ge.txt_render]]"
