source = "ge.layout"

[[constraints]]
id = "c1"
kind = "invariant"
expr = """The layout is a pure function of the graph model and the layout options: identical inputs always produce identical ranks, orders, coordinates, and edge paths. Verification is tiered (the [[ge.oracle]] c7 pattern): byte-comparable against the pinned oracle within the recorded envelope, and gently-only beyond it — deterministic re-render of gently's own output — because the oracle arms a default 5-second `alarm()` (Layout.pm:481) and cannot witness any claim at out-of-envelope scales (tests/repro/claims/size-envelope.observed: 200 nodes → "layout did not finish in time")."""
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "In the final grid, no two node cells overlap and every node is fully contained inside the grid."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "For acyclic graphs under a uniform graph-level flow, the configured flow direction (down, up, left, right) maps source nodes to strictly earlier positions along the flow axis than their targets; self-loops are exempt (source and target coincide), and the packed shared-target/diamond shapes the recorded corpus pins rank-equal are exempt (tests/scenarios/ge_layout.rs scope note). Cycles and per-edge flow overrides are documented divergences: the oracle routes back-edges and overridden edges AGAINST the flow (tests/repro/claims/layout-flow-direction.observed), so no flow-consistent reading of the unqualified claim exists; gently's placement follows the recorded corpus."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = """Every edge is routed along an orthogonal path of grid cells connecting its source port to its target port, passing through its label cell when the edge has a label; parallel edges between the same node pair are routed through distinct cells. Port-constrained edges (gently-89r) route from/to the NAMED side in the east pipeline: a `start:`/`end:` side south of its node (`right` = inflow+90 = south, upstream _flow_as_side; absolute `south`/`down` spellings alike) dips the edge through the gap row below the band — exiting the source's south, running straight under everything between, entering the target's south (`^`) — and a north side (`left`/`up`) bends above it (`v` into the target's north); `front` keeps the default attachment; the port never changes placement (tests/repro/claims/port-side-minimal.observed: the no-port bypass chain lays Trier inline exactly like the ported one). Indexed horizontal ports (`front,N` — the back/west/east spellings alike; bead gently-byq, SO 47323345, decoded from upstream Node.pm ~1170 + Path.pm) DO land the edge at the numbered slot: the indexed port grows its attached node's row span to `max(cy, N+1)` (the max-side rule `min_y = max(need.west, need.east)`; vertical sides `right/left/south/north,N` grow the column span upstream — unpinned, they contribute nothing here), the slot attaches the edge at grid row `band+N` (rendered as that row band's middle line, `band_top+3N+1`), and slot>0 edges route as: a START slot rides the source band east at the slot row to the target's column, then bends north into the target's south (arrow-end `^`); an END slot drops south from the source at the source column, then runs west at the attachment row into the target's east (`<`) — dodging EAST through the source's east-gap channel column when the drop cells are taken by an earlier edge's path (tests/repro/claims/so-start-port-index.observed: e2 start slot 3 and e3 end slot 2 with the dodge; the plain drop is probed, unpinned); slot 0 keeps the default attachment. The `back` (west) wrap still needs an out-of-bounding-box run — a documented divergence (docs/known-hard-cases.md) — and conflicting end sides, self-loops, cross-band routes, and the non-east flows keep their unported routes (no recorded shape ports them). The east placement pass processes edges in upstream's chain order (gently-pua, re-derived from Layout.pm's chain tracking and realized action stack): chains start at the roots (nodes never appearing as an edge target) in name order and walk along the flow — a `<>` edge counts from both ends, a plain or `--` edge only from its stored source — extending through each walk's unique unchained successor; a walk that runs into an already-chained node absorbs that chain's suffix (the later root's chain re-owns the shared nodes outright, upstream's merge), and a walk with several successors recurses first and absorbs the longest successor chain (first-in-model-order tie-break). Chains are laid out root-anchored first, then longest first, then start-name; each chain's layout claims its unclaimed members in order (the walk's opener edge — preferring an edge to an already-claimed neighbor — then the consecutive-link edges) and splices in the not-yet-laid chains its members' leftover links reach (upstream's inter-chain splice), so every node is placed by the first chain to claim it and a chain whose members were all absorbed re-ranks as a leftover leaf attaching to its placed successor west, east, else one band below — the box chain Bonn–train–Ulm lands inline on the flow row (Bonn west of the edge cell via the undirected `--`, Ulm east via the directed `-->`) and the anon buy leaf ranks one band below train (tests/repro/claims/bg-edge-node.observed, freshly re-derived: Bonn(0,2), train(2,2), Ulm(4,2), anon(2,4)); never-claimed leftovers keep model order, and the placement stays a pure function (c1). The pass also ranks against the graph's longest-path depths (gently-jrr): when a node's rank sits one column beyond the source's immediate east slot — the shared-middle bypass shape (Koblenz -> Trier -> Frankfurt forces Frankfurt east of Trier even when the Koblenz -> Frankfurt skip-edge would claim the east slot first; the chain order emits Trier -> Frankfurt before the skip-edge, and the rank rule guards any remaining inversion) — the node takes that rank column, leaving the middle node its inline slot on the band, and the skip-edge (a same-band non-adjacent route) bends through the gap row above the band (tests/repro/claims/bg-minlen-bypass.observed, byte-identical with and without the tutorial's incidental `minlen: 3`). Re-derived (gently-cbk): a west-going multi-band route bends out of the source's north/south FIRST — vertically through the gap rows at the source column — then runs along the gap row adjacent to the target band, ending at the target column; the source-band walk would drive through the intervening node cells (bg-edge-node.observed: Ulm->car exits Ulm north, turns west through the gap row below car's band, and its merged full-width dash cell ends at car's west edge). This is a within-envelope contract: at larger scales the pinned oracle itself silently drops edge paths ("could only place ... - giving up", Layout.pm:846; tests/repro/claims/layout-edge-drop.observed: 74 of 75 edges placed at 50 nodes), so large-graph edge-count fidelity is oracle-scoped-off ([[ge.oracle]] c7) and gently's own invariant — every model edge gets a routed path — is verified structurally instead. Re-derived (gently-4ga): both multi-band vertical walks — east-going down/up the target column, west-going out of the source's north/south (gently-cbk) — cover EVERY row between their endpoints at the walked column, not just the reserved gap rows, and jog around a band row occupied by a stacked node through the free gap column beside it: the jog happens on the free row before the blocked one and shifts back on the first free row after, east of the walked column unless that column sits at the grid's east edge (a stacked column always has a node one column east — placement only stacks below when the east slot is taken — and odd columns never hold nodes), so the realized path stays grid-adjacent end to end — source cell to first path cell to last path cell to target cell — and never enters a node cell; a walk toward a grown target stops at the target's span face nearest the source (it never crosses the target's own cells) (tests/scenarios/ge_layout.rs p4_fan_stack_routes_jog_not_jump: the comma-chain fan `[ A ] -> [ B ], [ C ], [ D ]` and the n1..n4 -> hub star render instead of erroring with "path cells not orthogonally adjacent"). The fan-IN star's exact oracle PLACEMENT is re-derived (gently-a6g, upstream Node.pm _grow + Layout/Path.pm _near_places/_clear_tries): a node carrying FOUR OR MORE unspecified edge-ends grows by the free-ports loop — per side free = `1 + (size − cnt − portnr)/2`, summed over north/south (column span) and east/west (row span), a pure sink skipping its front side (east for the east flow) — growing the row span then the column span by two until free ≥ unspecified (the star's hub grows to a 3-row span; fewer than four ends keep the base span, so the two-parallel corpus pair stays 1×1), and an unplaced source attaching to a placed target takes the target's slot ring — east rows top-to-bottom, below, west, above, at ring distance one then two — first slot clear of every placed node's span at Chebyshev distance one (no shared cell, no side adjacency, no corner touch): the first attacher takes the east ring slot at the hub's top row, the second slots two rows south (the adjacent row is cleared against the first), the third hangs below the grown span; bands map onto grid rows in sequence, and a band whose ring slot rides an earlier band's grown span at disjoint columns takes the offset row inside that span instead of the cursor south of it — same-column stacking keeps the cursor (tests/repro/claims/fan-layout.observed example 2, byte-exact — the fan-OUT class stays hash-seed-dependent under the pinned oracle and scoped-off, docs/known-hard-cases.md). A vertical travel whose endpoints' band-row spans leave a clear corridor (overlapping spans hosting each other's attachment rows, or node-free intermediate band rows at both endpoints' columns) routes without reserving gap rows; adjacent extents and blocked corridors keep the packed stack's gap rows. Re-derived (gently-awd): a size-attributed node is MULTI-celled — it occupies its whole `columns`×`rows` grid-cell span from its placement cell, so the rank→column map accumulates each same-band westward node's extra columns (`col(rank, band) = 2·rank + Σ(cx(n) − 1)` over the band's smaller-rank nodes — upstream places at absolute grid coordinates, `col(r) = col(r-1) + cx(r-1) + 1` when the band's ranks are contiguous), the bands below a multi-row node shift south over its row-span continuation rows (empty ones render 0-tall), a straight edge routes through the single gap column EAST of its source's span (or WEST of a target's, entering at the target's east border `col + cx − 1`), the routing walks treat every spanned cell as occupied, and the grid width extends over the eastmost span end (tests/repro/claims/size-attr.observed, tests/fixtures/graph-easy/size-attr.ascii.expected). Re-derived (gently-awd completion): parallel channels between a MULTI-ROW pair stack as grid ROWS through the boxes' row span — the pair's first edge keeps the straight band-row run and channel k rides the grid row `band + k` (a straight gap-column run, single path cell; a non-adjacent pair bends through the stacked row), while channels beyond the row span and one-row pairs keep the recorded bend shape (parallel.txt: channel 1 bends above the band); the channel rows carry edge cells, so the box grows to its full row span (4 + 3 + 3 = the flowchart's 10 rows). The channel ORDER stays model order (ge.layout.c1): the pinned oracle's channel order is hash-driven (seed 0 assigns the pair's second model edge to the band row, seed 1 the first — tests/repro/claims/so-flowchart-size.observed pins both), and gently's deterministic order byte-matches the seed-1 render — the same tier-2 hash-dependence class as the fan residuals (docs/known-hard-cases.md)."""
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c5"
kind = "extension_point"
expr = "The layout publishes its grid-output contract — cell grid, node extents, edge cell paths — which [[ge.ascii_render]], [[ge.boxart_render]], and [[ge.html_render]] consume via `satisfies`."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c6"
kind = "advisory"
expr = "For typical inputs the layout completes without exponential blowup: ranking, ordering, and routing run as bounded, deterministic heuristic iterations over the graph."
traces_to = "[[ge.layout]]"
