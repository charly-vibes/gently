source = "ge.layout"

[[constraints]]
id = "c1"
kind = "invariant"
expr = """The layout is a pure function of the graph model and the layout options: identical inputs always produce identical ranks, orders, coordinates, and edge paths. Verification is tiered (the [[ge.oracle]] c7 pattern): byte-comparable against the pinned oracle within the recorded envelope, and gently-only beyond it — deterministic re-render of gently's own output — because the oracle arms a default 5-second `alarm()` (Layout.pm:481) and cannot witness any claim at out-of-envelope scales (tests/repro/claims/size-envelope.observed: 200 nodes → "layout did not finish in time")."""
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "In the final grid, no two node cells overlap and every node is fully contained inside the grid."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "For acyclic graphs under a uniform graph-level flow, the configured flow direction (down, up, left, right) maps source nodes to strictly earlier positions along the flow axis than their targets; self-loops are exempt (source and target coincide), and the packed shared-target/diamond shapes the recorded corpus pins rank-equal are exempt (tests/scenarios/ge_layout.rs scope note). Cycles and per-edge flow overrides are documented divergences: the oracle routes back-edges and overridden edges AGAINST the flow (tests/repro/claims/layout-flow-direction.observed), so no flow-consistent reading of the unqualified claim exists; gently's placement follows the recorded corpus."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = """Every edge is routed along an orthogonal path of grid cells connecting its source port to its target port, passing through its label cell when the edge has a label; parallel edges between the same node pair are routed through distinct cells. Port-constrained edges (gently-89r) route from/to the NAMED side in the east pipeline: a `start:`/`end:` side south of its node (`right` = inflow+90 = south, upstream _flow_as_side; absolute `south`/`down` spellings alike) dips the edge through the gap row below the band — exiting the source's south, running straight under everything between, entering the target's south (`^`) — and a north side (`left`/`up`) bends above it (`v` into the target's north); `front` keeps the default attachment; the port never changes placement (tests/repro/claims/port-side-minimal.observed: the no-port bypass chain lays Trier inline exactly like the ported one — the inline shape is the shared-middle bypass divergence, follow-up bead gently-jrr). Indexed ports (`front,N`) and the `back` (west) wrap stay out of scope — they need geometry beyond the flat 3-line grid (variable node heights / an out-of-bounding-box run; docs/known-hard-cases.md, bead gently-byq for the index form) — and conflicting end sides, parallel channels, self-loops, cross-band routes, and the non-east flows keep their unported routes (no recorded shape ports them). This is a within-envelope contract: at larger scales the pinned oracle itself silently drops edge paths ("could only place ... - giving up", Layout.pm:846; tests/repro/claims/layout-edge-drop.observed: 74 of 75 edges placed at 50 nodes), so large-graph edge-count fidelity is oracle-scoped-off ([[ge.oracle]] c7) and gently's own invariant — every model edge gets a routed path — is verified structurally instead."""
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c5"
kind = "extension_point"
expr = "The layout publishes its grid-output contract — cell grid, node extents, edge cell paths — which [[ge.ascii_render]], [[ge.boxart_render]], and [[ge.html_render]] consume via `satisfies`."
traces_to = "[[ge.layout]]"

[[constraints]]
id = "c6"
kind = "advisory"
expr = "For typical inputs the layout completes without exponential blowup: ranking, ordering, and routing run as bounded, deterministic heuristic iterations over the graph."
traces_to = "[[ge.layout]]"
