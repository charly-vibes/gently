source = "ge.graphviz_render"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "Every node emits exactly one DOT node statement with a safely quoted name, and node attributes map onto their DOT counterparts."
traces_to = "[[ge.graphviz_render]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "Every edge emits one edge statement whose arrow (`->` or `--`) matches the model edge direction, with edge style attributes mapped to DOT attribute values. Re-derived (gently-0kg): the pinned oracle does NOT do this — its arrow follows the graph type, not the edge direction, so a `digraph` emits `->` for every edge and undirected/bidirectional model edges come back directed (tests/repro/claims/graphviz-round-trip.observed; `--` appears only under an undirected graph type, dot-direction.observed). gently mirrors the model edge direction as a documented divergence, so the emitted DOT preserves the model's directionality; byte-compat with upstream is abandoned here by design."
traces_to = "[[ge.graphviz_render]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "Every group emits a subgraph cluster containing exactly its member nodes, with the group label as cluster label; anonymous groups emit clusters named `cluster<N>` after their internal id, as upstream does."
traces_to = "[[ge.graphviz_render]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "Feeding the emitted DOT through [[ge.dot_parser]] yields a model isomorphic to the source model (same nodes, edges, directions, and group membership). Re-derived (gently-0kg): the isomorphism holds for group MEMBERSHIP but not group identity — named groups re-parse under the name `cluster_<name>` and anonymous groups under `cluster<N>`, so the verbatim group name and anonymity are not preserved (verified by render→parse scratch against the shipped renderer). Group-endpoint edges are outside this contract: the gently model cannot represent them, and upstream is lossy there anyway — `as_graphviz` emits an ARROWLESS statement for a member-bearing group-endpoint edge and crashes (`_graphviz_point` on undefined, As_graphviz.pm:547) on a bare one (tests/repro/claims/group-edge-graphviz.observed)."
traces_to = "[[ge.graphviz_render]]"
