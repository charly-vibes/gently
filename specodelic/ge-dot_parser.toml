source = "ge.dot_parser"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "A `graph` header sets the model graph's `type` attribute to `undirected` and a `digraph` header leaves the model graph at its directed default; a named header sets the model graph's `title` to its name verbatim and an unnamed header sets it to `unnamed`; neither header fixes the direction of individual edges."
traces_to = "[[ge.dot_parser]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "An edge chain `a -> b -> c;` creates one model edge per arrow, and each edge's direction follows its operator — `->` yields a directed edge and `--` yields an undirected edge — independently of the graph header."
traces_to = "[[ge.dot_parser]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "An attribute list `[key=val, key2=val2]` attached to a node or edge maps onto the model attributes of that object, with quoted values unescaped once; a graph-scope attribute statement `key=value` (quoted or bare value) applies to the model graph — or to the innermost enclosing named group — with `rankdir` remapped to `flow` per the oracle's direction map (LR→east, RL→west, TB→south, BT→north, unrecognized→east); every other key lands verbatim, the parser neither validates names nor remaps beyond `rankdir`."
traces_to = "[[ge.dot_parser]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "The parser links edges through a node stack that survives scope boundaries: a node statement in a group scope (the graph body or a named subgraph) replaces the stack, a node statement in a bare `{ }` scope pushes onto it, and an edge operator links every node on the stack to its right endpoint — so a bare scope or an inline named subgraph used as an edge-chain endpoint links every node on the surviving stack (leaked earlier entries first) to the chain target, while a plain `}` resets the stack, a scope with no inner edge links nothing, and an operator over an empty stack fails as not recognized. A subgraph block with a name maps to a model group whose name is the subgraph's name verbatim — except for the graphviz cluster convention (gently-j2i): an id `cluster_<name>` maps to group `<name>` and an id `cluster<N>` (bare digits after `cluster`) maps to an anonymous group — containing only the nodes declared directly inside it. A node statement inside a bare `{ }` scope joins the innermost ENCLOSING named group: the oracle's membership stack survives bare-scope boundaries — transitively through nested bare scopes — and pops when the named group's scope closes, so only a TOP-level bare scope keeps its nodes ungrouped (gently-fb1, observed tests/repro/claims/dot-bare-scope-in-named.observed)."
traces_to = "[[ge.dot_parser]]"

[[constraints]]
id = "c5"
kind = "effect"
expr = "A record label — a `shape=record` node whose label contains a vertical bar — or an HTML-like table label parses into numbered part nodes named `name.N`, with port markers stripped and edges reattached to the referenced part; a construct the parser cannot tokenize — such as the `subgraph` keyword without a name or a malformed HTML-like label — and a port reference with no matching part fail with a typed error, and no partial graph is returned."
traces_to = "[[ge.dot_parser]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = """The parser seeds the model graph with the upstream Graphviz parser's defaults (Graph::Easy::Parser::Graphviz::reset — "graphviz has different defaults as Graph::Easy"): the graph carries `flow: south` and `colorscheme: x11` and the edge base class carries `arrowstyle: filled` before the first statement is read, so an explicit `rankdir` (remapped per [[ge.dot_parser.c3]]), `flow`, or `colorscheme` statement overrides them; the group base class carries `align: center` and `fill: inherit` once a group is created — the upstream post-parse attribute table surfaces the group defaults only when a group exists (gently-cij; probe evidence tests/repro/claims/cli-input-from.observed)."""
traces_to = "[[ge.dot_parser]]"
