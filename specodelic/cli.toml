source = "cli"

[[constraints]]
id = "c1"
kind = "invariant"
expr = "With no file arguments, input is read from stdin; otherwise the first file argument is the input, a second file argument (or `--output`) names the output file, and further file arguments are silently ignored — bug-for-bug with the upstream script. Exception: when stdin is a terminal and no file argument is given, the source read fails fast with a diagnostic instead of blocking on interactive input (the oracle only ever exercises piped stdin, so agent/interactive invocations never hang; gently-in2)."
traces_to = "[[cli]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "The `--as` flag selects the output format (ascii, html, graphviz, txt; `dot` aliases graphviz), each routed to its library renderer, defaulting to ascii, or to the output filename's extension format when `--as` is absent; the `--output` flag names the output file that receives the rendered bytes — stdout when absent."
traces_to = "[[cli]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "Rendered output goes to stdout, diagnostics go to stderr, and the process exits 0 on success and nonzero on any parse or render error."
traces_to = "[[cli]]"

[[constraints]]
id = "c4"
kind = "effect"
expr = "An unknown output format produces a diagnostic on stderr naming the requested format and the valid formats, followed by exit code 255 — bug-for-bug with the upstream script, whose unknown `--as` dies calling the missing `as_<fmt>` method. The upstream-renderable but unwired names stay on this exit path as documented scope-offs (gently-4ig, tests/repro/claims/cli-formats.observed): svg dies under the pinned oracle's shebang perl (no in-dist `As_svg`), and boxart/vcg/gdl/graphml have no gently renderer yet."
traces_to = "[[cli]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "The CLI is built on the genesis-vibes foundation (crate >= 0.12): command dispatch via `Guide`, output via `Output::emit`, verbosity via `CliVerbosity` (`-v`/`-vv`/`-vvv`, `-q`), and format via `CliFormat`; `init` registers gently in `.genesis/tools.toml` via genesis discovery."
traces_to = "[[cli]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = "With `--json`, machine-readable results are emitted wrapped in the genesis Envelope (`ok`, `envelope_version`, `envelope_kind`, `data`, `warnings`, `hints`, `meta`); without it (human mode), the rendered graph is printed to stdout as raw bytes exactly as the oracle comparison requires."
traces_to = "[[cli]]"

[[constraints]]
id = "c7"
kind = "invariant"
expr = "An unknown subcommand or flag produces a genesis suggestion (`DidYouMean` / `Fix`) on stderr before the nonzero exit."
traces_to = "[[cli]]"

[[constraints]]
id = "c8"
kind = "effect"
expr = "`gently doctor` runs the suite health checks through genesis `DoctorRunner` — oracle availability (perl + pinned Graph::Easy), output-format support, fixture pin freshness — and applies available auto-fixes."
traces_to = "[[cli]]"

[[constraints]]
id = "c9"
kind = "invariant"
expr = "The input parser is selected by the `--from` flag — txt default, `dot` aliases graphviz, the boolean aliases `--from_txt`/`--from_graphviz`/`--from_vcg`/`--from_gdl` override `--from` in upstream's loop order, and `--from_dot` is NOT a declared upstream option (it hits the unknown-flag path, exit 2) — and, when txt is selected, by upstream's content sniffing: a line-start `(strict)?(di)?graph [name]? {` header routes the source to the DOT parser [[ge.dot_parser]] even under an explicit txt selection (the Graphviz parser never sniffs back), and a `graph: {` header routes to the VCG parser upstream. Unknown `--from` values produce the upstream `Unknown input format '<fmt>'` diagnostic and exit 255 (get_options' die); the upstream-valid `vcg`/`gdl` names route to a VCG parser gently never ports — documented scope-offs exiting 255 — and a sniffed `graph: {` header is the same scope-off at parse time (gently-cij; probe evidence tests/repro/claims/cli-input-from.observed)."
traces_to = "[[cli]]"
