source = "ge.text_parser"

[[constraints]]
id = "c1"
kind = "invariant"
expr = 'A bracketed token `[ Name ]` creates a named node, and later `[ Name ]` tokens reuse the existing node; the bare token `[ ]` creates an anonymous node that the oracle names `#N` (N an odd counter), which is findable and reusable by that generated name — in text only written escaped (`[ \#N ]`), since an unescaped `#` begins a comment (c7).'
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c2"
kind = "invariant"
expr = "The edge operators `->`, `=>`, `.>`, `~>`, `- >`, `.->`, `..->`, `= >` map to styles solid, double, dotted, wave, dashed, dot-dash, dot-dot-dash, and double-dash; the styles bold, wide, and broad are settable only via the `style` attribute. A `<` prefix before any of these operators makes the edge bidirectional (`<->` solid, `<=>` double, `<.>` dotted, `<~>` wave, `<- >` dashed, `<.->` dot-dash, `<..->` dot-dot-dash, `<= >` double-dash); the `<` requires a closing `>`, so a lone left arrow is a parse error; the operator further requires a node token on both sides — a missing left node (`--> [ b ]`) or missing right node (`[ a ] -->`) is a parse error."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c3"
kind = "invariant"
expr = "A chain `A -> B -> C` creates exactly one edge per adjacent pair with the correct endpoints, sharing node objects for repeated names."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c4"
kind = "invariant"
expr = "An inline edge label `-- label -->` sets the edge's label only when both flanking patterns match and the edge has an arrow; an arrow-less edge with an inline label is a parse error."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c5"
kind = "invariant"
expr = "An attribute block `{ key: value; }` applies to the nearest preceding object (node, edge, or group), and class sections `graph { ... }`, `node { ... }`, `edge { ... }`, `group { ... }` apply attributes to the whole class."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c6"
kind = "invariant"
expr = "A group block `( Name: ... )` produces a group whose name includes the colon (the oracle names it literally `G:`); a node declared inside belongs to exactly one group — referencing the node again inside a later group moves it there (the earlier group empties). Nested groups: a node declared in an inner group belongs only to that inner group, and the outer group contains only its directly declared nodes. An anonymous group `( [ A ] )` is named `Group #N` by the oracle."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c7"
kind = "invariant"
expr = 'An unescaped `#` starts a comment running to the end of the line, everywhere — mid-line and inside quoted attribute values — so `{ label: x # y }` is a parse error and `\#` escapes it; a line that is only a comment is dropped. As a special case, a 3- or 6-digit hex colour token (`#rgb`/`#rrggbb`) immediately following an attribute separator is auto-escaped and accepted.'
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c8"
kind = "effect"
expr = "A malformed input line produces a typed parse error naming the source line number and the reason."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c9"
kind = "invariant"
expr = "A directed edge pattern is one or more unit tokens (each of `= `, `=`, `- `, `-`, `..-`, `.-`, `.`, `~`) followed by `>`, and the edge's style is determined solely by the last unit token — repetitions and mixed units are accepted, so `..-..-..->` is dot-dot-dash while `..-..-..>` is a valid dotted edge. Arrow-less patterns: `.-` and `..-` are valid with a single repetition (dot-dash, dot-dot-dash), while the plain units (`=`, `= `, `-`, `- `, `.`, `~`) require at least two repetitions, and single-character arrow-less patterns are parse errors."
traces_to = "[[ge.text_parser]]"

[[constraints]]
id = "c10"
kind = "invariant"
expr = '''An attribute value is finalized with the upstream two-layer unquoting: after the parser-layer unescape and whitespace collapse, the store layer strips one pair of surrounding quotes — either `"` or `'`, mixed ends allowed, greedy first-and-last — then unescapes `\#`, `\"`, `\'`, `\;`, and `\\` to their bare characters; a value whose opening quote is never closed is accepted verbatim (quotes kept) and its first unescaped `;` still terminates the declaration, while a `;` inside a properly closed `"..."` value does not split and mid-value quotes are kept. (Probe evidence: tests/repro/claims/attr-quote-value.observed.)'''
traces_to = "[[ge.text_parser]]"
